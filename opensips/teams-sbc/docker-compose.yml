# ============================================================================
#  OpenSIPS 3.6 Microsoft Teams SBC -- Docker Compose
#
#  Services: mysql (MariaDB), opensips, rtpengine, sidecar (cert rotation +
#  5-minute core-IP refresh). opensips/rtpengine/sidecar use host networking so
#  TLS :5560 and the RTP media range bind real host addresses; MySQL stays on a
#  private bridge and only publishes 3306 on 127.0.0.1.
#
#  Quick start:
#    cp docker/.env.example .env        # set IPs, FQDNs, DB password, ACME creds
#    # edit local.m4 with your real IPs (M_TEAMS_TLS_*_IP, M_CORE_*_IP)
#    docker compose up -d --build
#  On first boot the opensips container self-signs a certificate so it can start;
#  the sidecar then obtains real ACME certs and refreshes the core IPs.
# ============================================================================
services:
  mysql:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-opensips}
      MARIADB_USER: ${DB_USER:-opensips}
      MARIADB_PASSWORD: ${DB_PASS:-opensipsrw}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-change-me-root}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  opensips:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: teams-sbc-opensips:latest
    network_mode: host
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-opensips}
      DB_PASS: ${DB_PASS:-opensipsrw}
      DB_NAME: ${DB_NAME:-opensips}
      MI_URL: http://127.0.0.1:8888/mi
      BOOTSTRAP_CN: ${BOOTSTRAP_CN:-sbc.teams.ucp.voiceland.dev}
      BOOTSTRAP_SANS: ${BOOTSTRAP_SANS:-DNS:*.teams.ucp.voiceland.dev,DNS:*.teams.ucp.voiceland.global,DNS:eu.ucp.voiceland.dev,DNS:eu.ucp.voiceland.global,DNS:sbc.teams.ucp.voiceland.dev}
    volumes:
      - .:/etc/opensips/teams-sbc

  rtpengine:
    image: drachtio/rtpengine:latest
    network_mode: host
    restart: unless-stopped
    command: >
      rtpengine
      --interface=${MEDIA_IP:-203.0.113.10}
      --listen-ng=127.0.0.1:2223
      --port-min=${RTP_PORT_MIN:-30000}
      --port-max=${RTP_PORT_MAX:-40000}
      --log-level=6 --log-stderr --foreground

  sidecar:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: teams-sbc-opensips:latest
    network_mode: host
    restart: unless-stopped
    depends_on:
      - opensips
    entrypoint: ["/etc/opensips/teams-sbc/docker/sidecar-entrypoint.sh"]
    # pull DNS-provider secrets (e.g. CLOUDFLARE_DNS_API_TOKEN) through to lego
    env_file:
      - .env
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-opensips}
      DB_PASS: ${DB_PASS:-opensipsrw}
      DB_NAME: ${DB_NAME:-opensips}
      MI_URL: http://127.0.0.1:8888/mi
      CORE_GROUP: "1"
      CORE_IPS_FQDN: ${CORE_IPS_FQDN:-eu.ucp.voiceland.dev}
      ROTATE_INTERVAL: ${ROTATE_INTERVAL:-86400}
      ACME_EMAIL: ${ACME_EMAIL:-tls@voiceland.dev}
      ACME_DNS_PROVIDER: ${ACME_DNS_PROVIDER:-cloudflare}
      LEGO_PATH: /var/lib/lego
    volumes:
      - .:/etc/opensips/teams-sbc
      - lego-data:/var/lib/lego

volumes:
  mysql-data:
  lego-data:
