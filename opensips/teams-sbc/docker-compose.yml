# ============================================================================
#  OpenSIPS 3.6 Microsoft Teams SBC -- Docker Compose
#
#  Per-instance / per-environment configuration lives in an env file selected at
#  run time:  .env.sbc1.dev , .env.sbc1.prod , .env.sbc2.dev , ...
#  Each env file sets ENV_FILE (its own path) and COMPOSE_PROJECT_NAME so
#  containers/volumes stay unique, and is injected into the containers (env_file
#  below) so local.m4 / the entrypoint pick up the instance's values.
#
#  Run an instance:
#    scripts/sbc.sh sbc1 dev up -d --build
#    # == docker compose --env-file .env.sbc1.dev up -d --build
#
#  opensips/rtpengine/sidecar use host networking; MariaDB publishes only on
#  127.0.0.1:${DB_PORT}. Co-locating multiple instances on ONE host requires
#  distinct IPs/ports (DB_PORT, MI_HTTP_PORT, TEAMS_TLS_*_IP, CORE_*, MEDIA_IP).
# ============================================================================
services:
  mysql:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-opensips}
      MARIADB_USER: ${DB_USER:-opensips}
      MARIADB_PASSWORD: ${DB_PASS:-opensipsrw}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-change-me-root}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  opensips:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: teams-sbc-opensips:latest
    network_mode: host
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # Inject the selected instance/env file into the container (drives local.m4
    # via the entrypoint's m4 build and the bootstrap).
    env_file:
      - ${ENV_FILE:-.env}
    volumes:
      - .:/etc/opensips/teams-sbc

  rtpengine:
    image: drachtio/rtpengine:latest
    network_mode: host
    restart: unless-stopped
    command: >
      rtpengine
      --interface=${MEDIA_IP:-203.0.113.10}
      --listen-ng=127.0.0.1:2223
      --port-min=${RTP_PORT_MIN:-30000}
      --port-max=${RTP_PORT_MAX:-40000}
      --log-level=6 --log-stderr --foreground

  sidecar:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: teams-sbc-opensips:latest
    network_mode: host
    restart: unless-stopped
    depends_on:
      - opensips
    entrypoint: ["/etc/opensips/teams-sbc/docker/sidecar-entrypoint.sh"]
    # same instance/env file -> DB creds, MI_URL, CORE_IPS_FQDN, ACME secrets
    env_file:
      - ${ENV_FILE:-.env}
    volumes:
      - .:/etc/opensips/teams-sbc
      - lego-data:/var/lib/lego

volumes:
  mysql-data:
  lego-data:
