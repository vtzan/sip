# ============================================================================
#  rtpengine sample configuration for the OpenSIPS Teams SBC
# ----------------------------------------------------------------------------
#  rtpengine performs the media plane work: it relays RTP and transcodes
#  between Teams SRTP (RTP/SAVP, SDES crypto) and carrier-side plain RTP
#  (RTP/AVP), following the flags OpenSIPS passes in rtpengine_offer/answer.
#
#  The control socket below (listen-ng) MUST match M_RTPENGINE_SOCK in local.m4
#  (default udp:127.0.0.1:2223).
# ============================================================================

[rtpengine]

# --- ng control protocol socket (OpenSIPS talks to rtpengine here) ---
listen-ng = 127.0.0.1:2223

# --- media interfaces ---------------------------------------------------------
# Single public interface (simplest). Replace with your media-facing public IP.
# If OpenSIPS advertises a public address while rtpengine binds a private one,
# use the "PUBLIC!PRIVATE" form, e.g.  interface = 203.0.113.10!10.0.0.10
interface = 203.0.113.10
#
# Two-interface (recommended) layout, matching the optional rtpengine flags
# `direction=internal` / `direction=external` you can add in local.m4:
#   interface = internal/10.0.0.10
#   interface = external/203.0.113.10

# --- RTP port range (open these UDP ports towards Teams media subnets) --------
port-min = 30000
port-max = 40000

# --- behaviour ----------------------------------------------------------------
timeout        = 60
silent-timeout = 3600
final-timeout  = 7200
delete-delay   = 0
tos            = 184

# --- logging ------------------------------------------------------------------
log-level  = 6
log-stderr = false

# --- recommended kernel forwarding (optional, needs xt_RTPENGINE module) ------
# table = 0
